name: Standard tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style:
    name: R style and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up R environment
        uses: ./.github/actions/setup-r-environment

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Check R style and lint
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v6

      - name: Set up R environment
        uses: ./.github/actions/setup-r-environment

      - name: Run testthat suite
        shell: Rscript {0}
        run: |
          project_library <- normalizePath(
            system2("rv", "library", stdout = TRUE),
            winslash = "/", mustWork = TRUE
          )
          stopifnot(normalizePath(.libPaths()[1], winslash = "/") == project_library)
          testthat::test_local(reporter = "summary")

